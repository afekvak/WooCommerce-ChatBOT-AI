<section id="chat-widget" role="dialog" aria-label="Store assistant" aria-modal="false">
  <aside class="chat-sidebar" id="chat-sidebar" aria-label="Saved conversations" hidden>
    <div class="sidebar-heading"><h2>Your chats</h2><button id="close-sidebar" type="button" class="header-btn" aria-label="Close chat list">&times;</button></div>
    <button id="sidebar-new-chat" class="sidebar-new" type="button">+ New chat</button>
    <div id="chat-list" class="chat-list" aria-live="polite"></div>
  </aside>
  <header class="chat-header">
    <div class="header-content">
      <div class="header-icon"><svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path d="M12 2c1.4 6.2 3.8 8.6 10 10-6.2 1.4-8.6 3.8-10 10C10.6 15.8 8.2 13.4 2 12c6.2-1.4 8.6-3.8 10-10Z"/></svg></div>
      <div class="header-title">
        <h1 id="mcp-title">Store assistant</h1>
        <p>Your WooCommerce workspace</p>
      </div>
    </div>
    <div class="header-controls">
      <button class="header-btn" id="chats-toggle" type="button" title="Your chats" aria-label="Your chats" aria-controls="chat-sidebar" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16m4-11h4m-4 5h4"/></svg></button>
      <button class="header-btn" id="header-new-chat" type="button" title="New chat" aria-label="New chat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
      <button class="header-btn" id="theme-toggle" type="button" title="Switch theme" aria-label="Switch theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg></button>
      <button class="header-btn" id="resize-chat" type="button" title="Expand chat" aria-label="Expand chat" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6M20 4l-7 7M10 20H4v-6m0 6 7-7"/></svg></button>
      <button class="header-btn" id="close-chat" type="button" title="Close chat" aria-label="Close chat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg></button>
    </div>
  </header>
  <nav class="chat-toolbar" aria-label="Conversation controls">
    <button class="toolbar-btn" id="new-chat" type="button" title="Start a new chat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8 8 0 0 1-8 8H6l-4 3 1.7-6A8 8 0 0 1 3 13v-2a8 8 0 0 1 8-8h2a8 8 0 0 1 8 8Z"/></svg><span>New chat</span></button>
    <button class="toolbar-btn" id="clear-chat" type="button" title="Clear this conversation"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7m4-7v7"/></svg><span>Clear chat</span></button>
  </nav>
  <div id="chat-messages" role="log" aria-label="Chat messages" aria-live="polite" aria-relevant="additions"></div>
  <footer class="chat-footer">
    <div class="input-wrapper">
      <textarea id="message-input" rows="1" placeholder="Ask about your store&hellip;" aria-label="Message your store assistant" aria-describedby="mcp-composer-help"></textarea>
    </div>
    <button id="send-btn" type="button" title="Send message" aria-label="Send message"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4 4 17 8-17 8 4-8-4-8Z"/><path d="M8 12h13"/></svg></button>
    <p class="composer-note" id="mcp-composer-help"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-10v.1"/></svg><span>Changes always ask for your confirmation.</span></p>
  </footer>
</section>
<button id="mcp-toggle" type="button" aria-label="Open store assistant" aria-expanded="false" aria-controls="chat-widget"><svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path d="M12 2c1.4 6.2 3.8 8.6 10 10-6.2 1.4-8.6 3.8-10 10C10.6 15.8 8.2 13.4 2 12c6.2-1.4 8.6-3.8 10-10Z"/></svg></button>
